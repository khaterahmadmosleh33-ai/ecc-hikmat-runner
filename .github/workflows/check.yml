name: Runner integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and run privilege, execution, file and timeout tests
        run: docker build --progress=plain --tag ecc-runner:test .
